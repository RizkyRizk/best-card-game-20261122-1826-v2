<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Court — a duel of cinder and flame</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17100b; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #17100b; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Court: a turn-based card duel. Play minions, attack the rival hero, and reduce them to zero life."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
